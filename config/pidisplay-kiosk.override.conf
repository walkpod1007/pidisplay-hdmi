# 放到 /etc/systemd/system/pidisplay-kiosk.service.d/override.conf
# 或用 sudo systemctl edit pidisplay-kiosk 貼進去，存檔後：
#   sudo systemctl daemon-reload && sudo systemctl restart pidisplay-kiosk
[Service]
# 螢幕方向：normal／left／right／inverted（直放面板通常是 left 或 right，裝上去看哪個正）
Environment=PIDISPLAY_ROTATION=left
# Zero 2 W（512 MB）跑高解析度一定要加這兩行：純軟體輸出，CPU 從 25% 降到 1% 以下
Environment=SDL_FRAMEBUFFER_ACCELERATION=0
Environment=SDL_RENDER_DRIVER=software
# 資訊列背景想要朦朧封面而不是平色深綠，打開這行
#Environment=PIDISPLAY_BG=blur
