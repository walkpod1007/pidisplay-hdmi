<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PiDisplay 設定</title><link rel="stylesheet" href="/style.css"><body class="settings"><header><span>PiDisplay</span><span>手機設定</span></header><h1>連上音樂，放下手機。</h1><p class="muted">1 連上 Wi-Fi → 2 選擇 Sonos／Roon。</p><p id="message" role="status"></p>
<section id="login"><h2>與螢幕配對</h2><form id="login-form"><label for="pin">HDMI 螢幕上的六位配對碼</label><input id="pin" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"><button>開始設定</button></form></section>
<div id="controls" hidden>
<p id="network-status" role="status"></p><button type="button" id="change-wifi" hidden>更換 Wi-Fi</button>
<section id="wifi-section"><h2>1 / 連上室內 Wi-Fi</h2><p>切換時手機會暫時斷線。把手機連回室內 Wi-Fi，再掃描螢幕的新 QR code，繼續第二步。</p><button id="scan" type="button">搜尋附近網路</button><label for="networks">附近的 Wi-Fi</label><select id="networks"><option value="">也可以手動輸入名稱</option></select><form id="wifi-form"><label for="ssid">Wi-Fi 名稱</label><input id="ssid" required maxlength="32" autocomplete="off"><label for="password">Wi-Fi 密碼（開放網路留空）</label><input id="password" type="password" maxlength="64" autocomplete="new-password"><button>連上 Wi-Fi</button></form></section>
<section id="source-section"><h2>2 / 連結 Sonos 或 Roon</h2><p>從區網取得目前播放的歌曲。選擇 Sonos 時，直接使用喇叭已有的音樂服務，不需要在這台螢幕登入音樂服務。</p>
<form id="source-form"><label for="source">顯示來源</label><select id="source"><option value="auto">自動（Sonos → Roon）</option><option value="sonos">Sonos</option><option value="roon">Roon</option></select><label for="sonos-group">Sonos 房間／群組</label><select id="sonos-group"><option value="">自動選擇播放中的房間</option></select><button id="sonos-scan" type="button">重新搜尋 Sonos</button><p id="sonos-status"></p><label for="zone">Roon 播放區域</label><select id="zone"><option value="">自動選擇播放中的區域</option></select><p id="roon-status"></p><p>Roon 使用者：在 Roon「設定 → 擴充功能」啟用 <strong>PiDisplay HDMI</strong>，再回來選擇區域。</p><button>儲存並進入歌曲畫面</button></form><button type="button" id="refresh-rooms">更新房間與區域</button><button type="button" id="skip">稍後設定，先進入待機</button></section>
</div><script src="/setup.js"></script></body></html>
